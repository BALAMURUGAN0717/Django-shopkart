{% load static %}
<style>
  .hero-carousel-wrapper {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    position: relative;
    background-color: transparent;
  }
  .hero-carousel-wrapper .carousel {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
    position: relative;
    overflow: hidden;
  }
  .hero-carousel-wrapper .carousel-inner {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
    position: relative;
  }
  .hero-carousel-wrapper .carousel-item {
    width: 100%;
    background-color: transparent;
  }
  .hero-carousel-wrapper .carousel-item img {
    width: 100%;
    height: auto;
    aspect-ratio: 1774 / 887;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .hero-carousel-wrapper .carousel-control-prev,
  .hero-carousel-wrapper .carousel-control-next {
    width: 44px;
    height: 44px;
    top: 50%;
    transform: translateY(-50%);
    background-color: rgba(0, 0, 0, 0.45);
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    opacity: 0.85;
    transition: all 0.25s ease;
    margin: 0 16px;
    z-index: 10;
  }
  .hero-carousel-wrapper .carousel-control-prev:hover,
  .hero-carousel-wrapper .carousel-control-next:hover {
    background-color: rgba(0, 0, 0, 0.8);
    opacity: 1;
    transform: translateY(-50%) scale(1.08);
  }
  .hero-carousel-wrapper .carousel-control-prev-icon,
  .hero-carousel-wrapper .carousel-control-next-icon {
    width: 18px;
    height: 18px;
  }
  @media (max-width: 575.98px) {
    .hero-carousel-wrapper .carousel-control-prev,
    .hero-carousel-wrapper .carousel-control-next {
      width: 32px;
      height: 32px;
      margin: 0 8px;
    }
    .hero-carousel-wrapper .carousel-control-prev-icon,
    .hero-carousel-wrapper .carousel-control-next-icon {
      width: 14px;
      height: 14px;
    }
  }
</style>

<div class="hero-carousel-wrapper">
  <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3" aria-label="Slide 4"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="{% static 'images/fav1.jpg' %}" class="d-block w-100" alt="Special Sale - Limited Time Offer">
      </div>
      <div class="carousel-item">
        <img src="{% static 'images/faav2.jpg' %}" class="d-block w-100" alt="Exclusive Discounts & Offers">
      </div>
      <div class="carousel-item">
        <img src="{% static 'images/fav5.jpg' %}" class="d-block w-100" alt="Shop Latest Tech & Gadgets">
      </div>
      <div class="carousel-item">
        <img src="{% static 'images/fav4.jpg' %}" class="d-block w-100" alt="Home Essentials & Fashion Deals">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev" aria-label="Previous">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next" aria-label="Next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</div>
