{% load static %}
<style>
  .hero-carousel-wrapper {
    background-color: #0f1113;
    width: 100%;
    overflow: hidden;
  }
  .hero-carousel-wrapper .carousel {
    max-width: 1440px;
    margin: 0 auto;
    position: relative;
    background-color: #0f1113;
  }
  .hero-carousel-wrapper .carousel-inner {
    width: 100%;
  }
  .hero-carousel-wrapper .carousel-item {
    background-color: #0f1113;
    text-align: center;
  }
  .hero-carousel-wrapper .carousel-item img {
    width: 100%;
    height: auto;
    aspect-ratio: 2 / 1;
    max-height: 540px;
    object-fit: contain;
    object-position: center;
    margin: 0 auto;
    display: block;
  }
  @media (max-width: 767.98px) {
    .hero-carousel-wrapper .carousel-item img {
      aspect-ratio: 2 / 1;
      max-height: none;
      object-fit: contain;
    }
  }
</style>

<div class="hero-carousel-wrapper">
  <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3" aria-label="Slide 4"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="{% static 'images/fav1.jpg' %}" class="d-block w-100" alt="Special Sale - Limited Time Offer">
      </div>
      <div class="carousel-item">
        <img src="{% static 'images/faav2.jpg' %}" class="d-block w-100" alt="Exclusive Discounts & Offers">
      </div>
      <div class="carousel-item">
        <img src="{% static 'images/fav5.jpg' %}" class="d-block w-100" alt="Shop Latest Tech & Gadgets">
      </div>
      <div class="carousel-item">
        <img src="{% static 'images/fav4.jpg' %}" class="d-block w-100" alt="Home Essentials & Fashion Deals">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</div>
